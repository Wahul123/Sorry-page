<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sorry Bala ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Arial,sans-serif;
    text-align:center;
    color:white;
}

.container{
    position:relative;
    z-index:10;
    padding-top:100px;
}

h1{
    font-size:70px;
}

p{
    font-size:35px;
    width:80%;
    margin:auto;
    line-height:1.8;
}

.heart{
    position:fixed;
    bottom:-20px;
    font-size:25px;
    animation:float 8s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(0);
        opacity:1;
    }
    100%{
        transform:translateY(-100vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🥺 SORRY BALA ❤️</h1>

    <p>
        Snj yaar... Sorryy Sorryy Sorryy Yaar... ❤️<br><br>

        Evdha raag nako karus na baccha... 😔<br><br>

        Majhyakadun chuk zali asel tar manapasun sorry... 🙏❤️<br><br>

        Tujhyashi bollyashivay mala kharach chan vatat nahi... 🥹<br><br>

        Please mala maaf kar na bala... ❤️✨
    </p>
</div>

<!-- Background Music -->
<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
function createHeart(){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);
}

setInterval(createHeart,300);
</script>

</body>
</html>
